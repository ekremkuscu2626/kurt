<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bozkurt Destanı - Türk Devletleri Yolu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a1a3e; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #F9D949; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 8px #000; z-index: 10; }
        #question-display { position: absolute; top: 80px; width: 100%; text-align: center; color: #FFFFFF; font-size: 26px; font-weight: bold; text-shadow: 3px 3px 10px #000; z-index: 10; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="ui">TÜRK GÜCÜ: <span id="score">0</span></div>
    <div id="question-display">Destan Yükleniyor...</div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, player, mixer, clock = new THREE.Clock();
        let targetX = 0, score = 0, currentQuestionIndex = 0, gates = [];

        const questions = [
            { q: "Tarihteki ilk Türk devleti hangisidir?", options: ["Asya Hun", "Osmanlı"], correct: 0 },
            { q: "İstiklal Marşı'mızın yazarı kimdir?", options: ["Ziya Gökalp", "M. Akif Ersoy"], correct: 1 },
            { q: "Bilge Kağan hangi devletin hükümdarıdır?", options: ["Göktürkler", "Uygurlar"], correct: 0 },
            { q: "Türkiye Cumhuriyeti kaç yılında kuruldu?", options: ["1920", "1923"], correct: 1 },
            { q: "Selçuklu Devleti'nin sembolü nedir?", options: ["Çift Başlı Kartal", "Aslan"], correct: 0 }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1a3e); // Gece Bozkırı Laciverti
            scene.fog = new THREE.Fog(0x0a1a3e, 1000, 15000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 200000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // GÜÇLÜ IŞIKLANDIRMA
            const ambient = new THREE.AmbientLight(0xffffff, 2.2);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(0, 1000, 500);
            scene.add(sun);

            // ZEMİN
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x4d3319 });
            const road = new THREE.Mesh(new THREE.BoxGeometry(2500, 10, 800000), roadMat);
            road.position.y = -5;
            scene.add(road);

            const loader = new THREE.GLTFLoader();

            // 1. BOZKURT YÜKLEME
            loader.load('wolf.glb', (gltf) => {
                player = gltf.scene;
                player.scale.set(80, 80, 80);
                player.rotation.y = Math.PI;
                scene.add(player);
                if(gltf.animations[0]) {
                    mixer = new THREE.AnimationMixer(player);
                    mixer.clipAction(gltf.animations[0]).play();
                }
                spawnQuestionSet();
            });

            // 2. YENİ AĞAÇ (GLB) YÜKLEME
            loader.load('agac.glb', (gltf) => {
                const treeModel = gltf.scene;
                for (let i = 0; i < 100; i++) {
                    let tL = treeModel.clone();
                    let tR = treeModel.clone();
                    
                    // Ölçek: .glb modellerde genellikle 10-50 arası idealdir
                    // Eğer çok küçük olurlarsa bu rakamı büyüt
                    let s = 40; 
                    tL.scale.set(s, s, s); tR.scale.set(s, s, s);

                    let z = -i * 1200 - 1000;
                    let xOffset = (Math.random() - 0.5) * 200; // Hafif dağınıklık

                    tL.position.set(-900 + xOffset, 0, z);
                    tR.position.set(900 + xOffset, 0, z);
                    
                    // Doğal görünüm için rastgele döndürme
                    tL.rotation.y = Math.random() * Math.PI;
                    tR.rotation.y = Math.random() * Math.PI;

                    scene.add(tL, tR);
                }
            }, undefined, (error) => {
                console.error("Ağaç yüklenemedi, ama oyun devam ediyor:", error);
            });

            // KONTROLLER
            window.addEventListener('pointermove', (e) => {
                if(e.buttons === 1 || e.pointerType === 'touch') {
                    targetX = Math.max(-1000, Math.min(1000, targetX + e.movementX * 2.5));
                }
            });

            animate();
        }

        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#00ADB5'; ctx.fillRect(0,0,512,256);
            ctx.strokeStyle = '#F9D949'; ctx.lineWidth = 20; ctx.strokeRect(10,10,492,236);
            ctx.fillStyle = 'white'; ctx.font = 'bold 50px Arial'; ctx.textAlign = 'center';
            ctx.fillText(text, 256, 145);
            return new THREE.CanvasTexture(canvas);
        }

        function spawnQuestionSet() {
            if(!player) return;
            let q = questions[currentQuestionIndex];
            document.getElementById('question-display').innerText = q.q;
            createGate(q.options[0], -500, player.position.z - 4500, q.correct === 0);
            createGate(q.options[1], 500, player.position.z - 4500, q.correct === 1);
        }

        function createGate(txt, x, z, isCorrect) {
            const gate = new THREE.Mesh(
                new THREE.BoxGeometry(600, 400, 40),
                new THREE.MeshStandardMaterial({ map: createTextTexture(txt) })
            );
            gate.position.set(x, 200, z);
            gate.userData = { isCorrect, active: true };
            scene.add(gate);
            gates.push(gate);
        }

        function animate() {
            requestAnimationFrame(animate);
            let d = clock.getDelta();
            if (player) {
                player.position.z -= 15;
                player.position.x += (targetX - player.position.x) * 0.1;

                camera.position.set(player.position.x * 0.6, 500, player.position.z + 900);
                camera.lookAt(player.position.x, 150, player.position.z - 400);

                gates.forEach((g) => {
                    if (g.userData.active && Math.abs(g.position.z - player.position.z) < 150 && Math.abs(g.position.x - player.position.x) < 350) {
                        g.userData.active = false;
                        if (g.userData.isCorrect) score += 100; else score = Math.max(0, score - 50);
                        document.getElementById('score').innerText = score;
                        setTimeout(() => {
                            gates.forEach(gt => scene.remove(gt));
                            gates = [];
                            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                            spawnQuestionSet();
                        }, 200);
                    }
                });
            }
            if (mixer) mixer.update(d);
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
