<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bozkurt Destanı - Türk Devletleri Yolu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a1a3e; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #F9D949; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 10px #000; z-index: 10; }
        #question-display { position: absolute; top: 80px; width: 100%; text-align: center; color: #FFFFFF; font-size: 22px; font-weight: bold; text-shadow: 3px 3px 12px #000; z-index: 10; padding: 0 15px; }
    </style>
</head>
<body>
    <div id="ui">TÜRK GÜCÜ: <span id="score">0</span></div>
    <div id="question-display">Destan Başlıyor...</div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, player, mixer, clock = new THREE.Clock();
        let targetX = 0, score = 0, currentQuestionIndex = 0, gates = [];
        let mountain; // Dağ objesi

        const questions = [
            { q: "Tarihteki ilk Türk devleti hangisidir?", options: ["Asya Hun", "Osmanlı"], correct: 0 },
            { q: "İstiklal Marşı'mızın yazarı kimdir?", options: ["Ziya Gökalp", "M. Akif Ersoy"], correct: 1 },
            { q: "Bilge Kağan hangi devletin hükümdarıdır?", options: ["Göktürkler", "Uygurlar"], correct: 0 },
            { q: "Türkiye Cumhuriyeti kaç yılında kuruldu?", options: ["1920", "1923"], correct: 1 },
            { q: "Selçuklu Devleti'nin sembolü nedir?", options: ["Çift Başlı Kartal", "Aslan"], correct: 0 }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1a3e); 
            scene.fog = new THREE.Fog(0x0a1a3e, 1000, 15000);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 200000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 2.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.8);
            sun.position.set(300, 1000, 800);
            scene.add(sun);

            // DAR PATIKA YOLU
            const roadGeo = new THREE.BoxGeometry(750, 10, 1000000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x4a3222 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.y = -5;
            scene.add(road);

            // HEYBETLİ DAĞ OLUŞTURMA (Yolun Sonunda)
            function createMountain() {
                const mountainGroup = new THREE.Group();
                
                // Dağ gövdesi (Konik yapı)
                const mtGeo = new THREE.ConeGeometry(4000, 5000, 4);
                const mtMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, flatShading: true });
                const mainPeak = new THREE.Mesh(mtGeo, mtMat);
                mountainGroup.add(mainPeak);

                // Karlı zirve
                const snowGeo = new THREE.ConeGeometry(1800, 2000, 4);
                const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
                const snowCap = new THREE.Mesh(snowGeo, snowMat);
                snowCap.position.y = 1600; 
                mountainGroup.add(snowCap);

                mountainGroup.position.set(0, 1500, -25000); // Çok ileriye koyduk
                scene.add(mountainGroup);
                return mountainGroup;
            }
            mountain = createMountain();

            const loader = new THREE.GLTFLoader();

            // BOZKURT
            loader.load('wolf.glb', (gltf) => {
                player = gltf.scene;
                player.scale.set(95, 95, 95); 
                player.rotation.y = Math.PI;
                scene.add(player);
                if(gltf.animations[0]) {
                    mixer = new THREE.AnimationMixer(player);
                    mixer.clipAction(gltf.animations[0]).play();
                }
                spawnQuestionSet();
            });

            // DEV AĞAÇLAR
            loader.load('agac.glb', (gltf) => {
                const treeModel = gltf.scene;
                for (let i = 0; i < 200; i++) {
                    let tL = treeModel.clone();
                    let tR = treeModel.clone();
                    let s = 250 + Math.random() * 200; 
                    tL.scale.set(s, s, s); tR.scale.set(s, s, s);
                    let z = -i * 1200 - 1000;
                    tL.position.set(-600 - Math.random() * 400, 0, z);
                    tR.position.set(600 + Math.random() * 400, 0, z);
                    tL.rotation.y = Math.random() * Math.PI;
                    tR.rotation.y = Math.random() * Math.PI;
                    scene.add(tL, tR);
                }
            });

            window.addEventListener('pointermove', (e) => {
                if(e.buttons === 1 || e.pointerType === 'touch') {
                    targetX = Math.max(-350, Math.min(350, targetX + e.movementX * 2.2));
                }
            });

            animate();
        }

        function createGateTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#008b8b'; ctx.fillRect(0,0,512,256);
            ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 15; ctx.strokeRect(5,5,502,246);
            ctx.fillStyle = 'white'; ctx.font = 'bold 45px Arial'; ctx.textAlign = 'center';
            ctx.fillText(text, 256, 145);
            return new THREE.CanvasTexture(canvas);
        }

        function spawnQuestionSet() {
            if(!player) return;
            let q = questions[currentQuestionIndex];
            document.getElementById('question-display').innerText = q.q;
            createGate(q.options[0], -200, player.position.z - 4500, q.correct === 0);
            createGate(q.options[1], 200, player.position.z - 4500, q.correct === 1);
        }

        function createGate(txt, x, z, isCorrect) {
            const gate = new THREE.Mesh(
                new THREE.BoxGeometry(380, 280, 40),
                new THREE.MeshStandardMaterial({ map: createGateTexture(txt) })
            );
            gate.position.set(x, 140, z);
            gate.userData = { isCorrect, active: true };
            scene.add(gate);
            gates.push(gate);
        }

        function animate() {
            requestAnimationFrame(animate);
            let d = clock.getDelta();
            if (player) {
                player.position.z -= 20; 
                player.position.x += (targetX - player.position.x) * 0.15;

                camera.position.set(player.position.x * 0.5, 450, player.position.z + 900);
                camera.lookAt(player.position.x, 180, player.position.z - 500);

                // Dağı sürekli ileriye taşıyoruz ki yol hiç bitmesin (Sonsuz yol illüzyonu)
                if(mountain) {
                    mountain.position.z = player.position.z - 15000;
                }

                gates.forEach((g) => {
                    if (g.userData.active && Math.abs(g.position.z - player.position.z) < 150 && Math.abs(g.position.x - player.position.x) < 220) {
                        g.userData.active = false;
                        if (g.userData.isCorrect) score += 100; else score = Math.max(0, score - 50);
                        document.getElementById('score').innerText = score;
                        setTimeout(() => {
                            gates.forEach(gt => scene.remove(gt));
                            gates = [];
                            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                            spawnQuestionSet();
                        }, 200);
                    }
                });
            }
            if (mixer) mixer.update(d);
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
