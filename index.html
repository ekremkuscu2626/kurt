<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bozkurt Destanı - Türk Devletleri Yolu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a1a3e; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #F9D949; font-size: 36px; font-weight: bold; text-shadow: 2px 2px 10px #000; z-index: 10; }
        #question-display { position: absolute; top: 90px; width: 100%; text-align: center; color: #FFFFFF; font-size: 28px; font-weight: bold; text-shadow: 3px 3px 12px #000; z-index: 10; padding: 0 15px; }
    </style>
</head>
<body>
    <div id="ui">TÜRK GÜCÜ: <span id="score">0</span></div>
    <div id="question-display">Destan Başlıyor...</div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, player, mixer, clock = new THREE.Clock();
        let targetX = 0, score = 0, currentQuestionIndex = 0, gates = [];

        const questions = [
            { q: "Tarihteki ilk Türk devleti hangisidir?", options: ["Asya Hun", "Osmanlı"], correct: 0 },
            { q: "İstiklal Marşı'mızın yazarı kimdir?", options: ["Ziya Gökalp", "M. Akif Ersoy"], correct: 1 },
            { q: "Bilge Kağan hangi devletin hükümdarıdır?", options: ["Göktürkler", "Uygurlar"], correct: 0 },
            { q: "Türkiye Cumhuriyeti kaç yılında kuruldu?", options: ["1920", "1923"], correct: 1 },
            { q: "Selçuklu Devleti'nin sembolü nedir?", options: ["Çift Başlı Kartal", "Aslan"], correct: 0 }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1a3e); // Derin lacivert gökyüzü
            scene.fog = new THREE.Fog(0x0a1a3e, 2000, 20000);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 100000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // AYDINLATMA - Görüntüdeki karanlığı tamamen çözer
            const ambient = new THREE.AmbientLight(0xffffff, 2.5);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.8);
            sun.position.set(500, 2000, 1000);
            scene.add(sun);

            // ZEMİN (Yol genişliği ve derinliği optimize edildi)
            const roadGeo = new THREE.BoxGeometry(4000, 10, 1000000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 }); // Toprak rengi
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.y = -5;
            scene.add(road);

            const loader = new THREE.GLTFLoader();

            // 1. BOZKURT ÖLÇEĞİ (Karakterin yoldaki duruşu)
            loader.load('wolf.glb', (gltf) => {
                player = gltf.scene;
                player.scale.set(120, 120, 120); // Daha belirgin bir kurt
                player.rotation.y = Math.PI;
                scene.add(player);
                if(gltf.animations[0]) {
                    mixer = new THREE.AnimationMixer(player);
                    mixer.clipAction(gltf.animations[0]).play();
                }
                spawnQuestionSet();
            });

            // 2. AĞAÇ ÖLÇEĞİ (Heybetli orman hissi)
            loader.load('agac.glb', (gltf) => {
                const treeModel = gltf.scene;
                for (let i = 0; i < 120; i++) {
                    let tL = treeModel.clone();
                    let tR = treeModel.clone();
                    
                    // Ağaçlar artık çalı değil, devasa çamlar gibi görünecek
                    let s = 250 + Math.random() * 100; 
                    tL.scale.set(s, s, s); tR.scale.set(s, s, s);

                    let z = -i * 1800 - 1500;
                    // Yolun hemen kenarına ve biraz daha uzağına rastgele dizilim
                    tL.position.set(-1300 - Math.random() * 800, 0, z);
                    tR.position.set(1300 + Math.random() * 800, 0, z);
                    
                    tL.rotation.y = Math.random() * Math.PI;
                    tR.rotation.y = Math.random() * Math.PI;

                    scene.add(tL, tR);
                }
            });

            // KONTROLLER (Hassasiyet artırıldı)
            window.addEventListener('pointermove', (e) => {
                if(e.buttons === 1 || e.pointerType === 'touch') {
                    targetX = Math.max(-1800, Math.min(1800, targetX + e.movementX * 3));
                }
            });

            animate();
        }

        function createGateTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#00ADB5'; ctx.fillRect(0,0,512,256); // Turkuaz ana renk
            ctx.strokeStyle = '#F9D949'; ctx.lineWidth = 25; ctx.strokeRect(10,10,492,236);
            ctx.fillStyle = 'white'; ctx.font = 'bold 55px Arial'; ctx.textAlign = 'center';
            ctx.fillText(text, 256, 150);
            return new THREE.CanvasTexture(canvas);
        }

        function spawnQuestionSet() {
            if(!player) return;
            let q = questions[currentQuestionIndex];
            document.getElementById('question-display').innerText = q.q; //
            // Kapıları kurdun hızına göre ileriye yerleştiriyoruz
            createGate(q.options[0], -750, player.position.z - 6000, q.correct === 0);
            createGate(q.options[1], 750, player.position.z - 6000, q.correct === 1);
        }

        function createGate(txt, x, z, isCorrect) {
            // Kapı boyutları büyütüldü
            const gate = new THREE.Mesh(
                new THREE.BoxGeometry(850, 500, 60),
                new THREE.MeshStandardMaterial({ map: createGateTexture(txt) })
            );
            gate.position.set(x, 250, z);
            gate.userData = { isCorrect, active: true };
            scene.add(gate);
            gates.push(gate);
        }

        function animate() {
            requestAnimationFrame(animate);
            let d = clock.getDelta();
            if (player) {
                player.position.z -= 18; // Akıcı hız
                player.position.x += (targetX - player.position.x) * 0.12;

                // KAMERA ÖLÇEKLENDİRMESİ (Daha sinematik takip)
                camera.position.set(player.position.x * 0.4, 650, player.position.z + 1200);
                camera.lookAt(player.position.x, 200, player.position.z - 600);

                gates.forEach((g) => {
                    if (g.userData.active && Math.abs(g.position.z - player.position.z) < 200 && Math.abs(g.position.x - player.position.x) < 450) {
                        g.userData.active = false;
                        if (g.userData.isCorrect) {
                            score += 100;
                        } else {
                            score = Math.max(0, score - 50);
                        }
                        document.getElementById('score').innerText = score;
                        
                        setTimeout(() => {
                            gates.forEach(gt => scene.remove(gt));
                            gates = [];
                            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                            spawnQuestionSet();
                        }, 200);
                    }
                });
            }
            if (mixer) mixer.update(d);
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
