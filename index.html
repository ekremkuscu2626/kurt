<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kurt - GERÇEK DEVASA BOYUT</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; 
              font-size: 32px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 8px #000; }
        #yukleme { position: absolute; width: 100%; height: 100%; background: #222; 
                   display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; }
    </style>
</head>
<body>
    <div id="yukleme"><h1>DEV KURT EKRANI KAPLIYOR...</h1></div>
    <div id="ui">EZİLEN: <span id="score">0</span></div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, player, mixer;
        let clock = new THREE.Clock();
        let targetX = 0, enemies = [], particles = [];
        let score = 0, shakeIntensity = 0;
        
        let playerHitboxBox3 = new THREE.Box3();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 200, 4000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 100000); 
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            let sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(400, 800, 400);
            scene.add(sun);

            // Genişletilmiş Yol
            let road = new THREE.Mesh(new THREE.BoxGeometry(2000, 4, 200000), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            road.position.y = -10;
            scene.add(road);

            const loader = new THREE.GLTFLoader();
            loader.load('wolf.glb', (gltf) => {
                player = gltf.scene;
                // --- KURT 100 ÖLÇEĞİNDE (DEV) ---
                player.scale.set(100, 100, 100); 
                player.rotation.y = Math.PI; 
                scene.add(player);

                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(player);
                    mixer.clipAction(gltf.animations[0]).play();
                }
                document.getElementById('yukleme').style.display = 'none';
            }, undefined, () => yedekKarakterOlustur());

            // Kutuları küçülttüm ve daha sık yerleştirdim
            for(let i=1; i<400; i++) createEnemy((Math.random() - 0.5) * 1000, -i * 100 - 500);

            window.addEventListener('pointermove', (e) => {
                if (e.buttons === 1 || e.pointerType === 'touch') {
                    targetX += e.movementX * 1.8;
                    targetX = Math.max(-800, Math.min(800, targetX));
                }
            });

            animate();
        }

        function createEnemy(x, z) {
            // --- KUTULARI KÜÇÜK TUTUYORUZ (KURT DEV GÖRÜNSÜN DİYE) ---
            let enemy = new THREE.Mesh(
                new THREE.BoxGeometry(20, 20, 20), 
                new THREE.MeshStandardMaterial({ color: 0xff3300 })
            );
            enemy.position.set(x, 0, z);
            enemy.userData.hitbox = new THREE.Box3(); 
            scene.add(enemy);
            enemies.push(enemy);
        }

        function explode(x, y, z, color) {
            for(let i=0; i<20; i++) {
                let p = new THREE.Mesh(new THREE.BoxGeometry(5, 5, 5), new THREE.MeshBasicMaterial({ color: color }));
                p.position.set(x, y, z);
                p.userData = { vx: (Math.random()-0.5)*20, vy: Math.random()*20, vz: (Math.random()-0.5)*20, life: 1.0 };
                scene.add(p);
                particles.push(p);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();

            if (player) {
                player.position.z -= 6.0; // Dev cüsse için daha hızlı akış
                player.position.x += (targetX - player.position.x) * 0.15;
                
                // Görünmez hitbox (Kurdun dev gövdesine tam uyumlu)
                let min = new THREE.Vector3(player.position.x - 45, player.position.y, player.position.z - 80);
                let max = new THREE.Vector3(player.position.x + 45, player.position.y + 120, player.position.z + 80);
                playerHitboxBox3.set(min, max);

                // --- KAMERAYI KURDA YAKLAŞTIRDIM (DEVASA HİS İÇİN) ---
                camera.position.set(player.position.x * 0.5 + (Math.random()-0.5)*shakeIntensity, 250, player.position.z + 550);
                camera.lookAt(player.position.x, 80, player.position.z - 200);
                
                if(shakeIntensity > 0) shakeIntensity *= 0.9;

                enemies.forEach((e, i) => {
                    e.userData.hitbox.setFromObject(e);
                    if(playerHitboxBox3.intersectsBox(e.userData.hitbox)) {
                        explode(e.position.x, e.position.y, e.position.z, e.material.color);
                        scene.remove(e);
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('score').innerText = score;
                        shakeIntensity = 15.0; // Sarsıntı dev cüsse için daha sert
                    }
                });
            }

            particles.forEach((p, i) => {
                p.position.x += p.userData.vx; p.position.y += p.userData.vy; p.position.z += p.userData.vz;
                p.userData.vy -= 0.6; p.userData.life -= 0.03;
                p.scale.setScalar(p.userData.life);
                if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
            });

            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }

        function yedekKarakterOlustur() {
            player = new THREE.Mesh(new THREE.BoxGeometry(100, 150, 200), new THREE.MeshStandardMaterial({ color: 0x0000ff }));
            scene.add(player);
            document.getElementById('yukleme').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
