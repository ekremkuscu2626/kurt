<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bozkurt Destanı - Türk Devletleri Yolu</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a1a3e; font-family: 'Segoe UI', sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #F9D949; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 8px #000; z-index: 10; }
        #question-display { position: absolute; top: 80px; width: 100%; text-align: center; color: #FFFFFF; font-size: 26px; font-weight: bold; text-shadow: 3px 3px 10px #000; z-index: 10; padding: 0 10px; }
    </style>
</head>
<body>
    <div id="ui">TÜRK GÜCÜ: <span id="score">0</span></div>
    <div id="question-display">Destan Yükleniyor...</div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        let scene, camera, renderer, player, mixer, clock = new THREE.Clock();
        let targetX = 0, score = 0, currentQuestionIndex = 0, gates = [];

        const questions = [
            { q: "Tarihteki ilk Türk devleti hangisidir?", options: ["Asya Hun", "Osmanlı"], correct: 0 },
            { q: "İstiklal Marşı'mızın yazarı kimdir?", options: ["Ziya Gökalp", "M. Akif Ersoy"], correct: 1 },
            { q: "Bilge Kağan hangi devletin hükümdarıdır?", options: ["Göktürkler", "Uygurlar"], correct: 0 },
            { q: "Türkiye Cumhuriyeti kaç yılında kuruldu?", options: ["1920", "1923"], correct: 1 },
            { q: "Selçuklu Devleti'nin sembolü nedir?", options: ["Çift Başlı Kartal", "Aslan"], correct: 0 }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a1a3e); // Derin mavi/lacivert gökyüzü
            scene.fog = new THREE.Fog(0x0a1a3e, 1000, 15000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 100000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // GÜÇLÜ IŞIKLANDIRMA
            const ambient = new THREE.AmbientLight(0xffffff, 2.0);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(0, 1000, 500);
            scene.add(sun);

            // BOZKIR ZEMİNİ
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x4d3319 });
            const road = new THREE.Mesh(new THREE.BoxGeometry(2500, 10, 600000), roadMat);
            road.position.y = -5;
            scene.add(road);

            // KURT (GLB) YÜKLEME
            const gltfLoader = new THREE.GLTFLoader();
            gltfLoader.load('wolf.glb', (gltf) => {
                player = gltf.scene;
                player.scale.set(80, 80, 80);
                player.rotation.y = Math.PI;
                scene.add(player);
                if(gltf.animations[0]) {
                    mixer = new THREE.AnimationMixer(player);
                    mixer.clipAction(gltf.animations[0]).play();
                }
                spawnQuestionSet();
            }, undefined, (e) => { console.error("Kurt yükleme hatası:", e); });

            // AĞAÇ (OBJ/MTL) YÜKLEME - HATA KONTROLLÜ
            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.load('agac.mtl', (materials) => {
                materials.preload();
                const objLoader = new THREE.OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load('agac.obj', (obj) => {
                    for (let i = 0; i < 80; i++) {
                        let tL = obj.clone();
                        let tR = obj.clone();
                        let s = 40; // Ağaç büyüklüğü
                        tL.scale.set(s, s, s); tR.scale.set(s, s, s);
                        let z = -i * 1200 - 1000;
                        tL.position.set(-850, 0, z);
                        tR.position.set(850, 0, z);
                        scene.add(tL, tR);
                    }
                }, undefined, (e) => console.log("Ağaç OBJ yüklenemedi, oyun devam ediyor."));
            }, undefined, (e) => console.log("Ağaç MTL yüklenemedi, oyun devam ediyor."));

            // KONTROLLER
            window.addEventListener('pointermove', (e) => {
                if(e.buttons === 1 || e.pointerType === 'touch') {
                    targetX = Math.max(-950, Math.min(950, targetX + e.movementX * 2.5));
                }
            });

            animate();
        }

        function spawnQuestionSet() {
            let q = questions[currentQuestionIndex];
            document.getElementById('question-display').innerText = q.q;
            createGate(q.options[0], -500, player.position.z - 4500, q.correct === 0);
            createGate(q.options[1], 500, player.position.z - 4500, q.correct === 1);
        }

        function createGate(txt, x, z, isCorrect) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#00ADB5'; ctx.fillRect(0,0,512,256); // Turkuaz
            ctx.strokeStyle = '#F9D949'; ctx.lineWidth = 15; ctx.strokeRect(5,5,502,246);
            ctx.fillStyle = 'white'; ctx.font = 'bold 55px Arial'; ctx.textAlign = 'center';
            ctx.fillText(txt, 256, 145);
            
            const gate = new THREE.Mesh(
                new THREE.BoxGeometry(600, 380, 40),
                new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas) })
            );
            gate.position.set(x, 190, z);
            gate.userData = { isCorrect, active: true };
            scene.add(gate);
            gates.push(gate);
        }

        function animate() {
            requestAnimationFrame(animate);
            let d = clock.getDelta();
            if (player) {
                player.position.z -= 14; // Bozkurt hızı
                player.position.x += (targetX - player.position.x) * 0.12;

                // Kamera ayarı
                camera.position.set(player.position.x * 0.6, 450, player.position.z + 850);
                camera.lookAt(player.position.x, 150, player.position.z - 300);

                // Çarpışma kontrolü
                gates.forEach((g) => {
                    if (g.userData.active && Math.abs(g.position.z - player.position.z) < 120 && Math.abs(g.position.x - player.position.x) < 300) {
                        g.userData.active = false;
                        if (g.userData.isCorrect) score += 100; else score = Math.max(0, score - 50);
                        document.getElementById('score').innerText = score;
                        
                        setTimeout(() => {
                            gates.forEach(gt => scene.remove(gt));
                            gates = [];
                            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                            spawnQuestionSet();
                        }, 200);
                    }
                });
            }
            if (mixer) mixer.update(d);
            renderer.render(scene, camera);
        }

        init();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
